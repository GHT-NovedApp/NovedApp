name: Publicar demo estática

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: NovedAPP/site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4